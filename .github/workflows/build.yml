name: CineMovie + Vega 5.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: cinemovie-vega-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create log directory
        run: mkdir -p build-logs

      - name: Record environment
        if: always()
        run: |
          {
            echo "===== SYSTEM ====="
            uname -a
            echo
            echo "===== NODE ====="
            node --version
            npm --version
            echo
            echo "===== JAVA ====="
            java -version
            echo
            echo "===== REPOSITORY ====="
            git rev-parse HEAD
            git status --short
          } > build-logs/environment.log 2>&1

      - name: Install dependencies
        id: npm_install
        run: |
          set +e

          if [ -f package-lock.json ]; then
            npm ci --verbose 2>&1 | tee build-logs/npm-install.log
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile 2>&1 | tee build-logs/npm-install.log
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile 2>&1 | tee build-logs/npm-install.log
          else
            npm install 2>&1 | tee build-logs/npm-install.log
          fi

          status=${PIPESTATUS[0]}
          echo "$status" > build-logs/npm-install.exit
          exit "$status"

      - name: Run lint
        id: lint
        if: success()
        run: |
          set +e
          npm run lint 2>&1 | tee build-logs/lint.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-logs/lint.exit
          exit "$status"

      - name: Run tests
        id: tests
        if: success()
        run: |
          set +e

          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test -- --runInBand 2>&1 | tee build-logs/tests.log
            status=${PIPESTATUS[0]}
          else
            echo "No npm test script found; skipped." \
              | tee build-logs/tests.log
            status=0
          fi

          echo "$status" > build-logs/tests.exit
          exit "$status"

      - name: Build provider sandbox
        id: sandbox
        if: success()
        run: |
          set +e

          if npm run | grep -qE '^[[:space:]]+build:sandbox'; then
            npm run build:sandbox 2>&1 | tee build-logs/sandbox-build.log
            status=${PIPESTATUS[0]}
          else
            echo "No build:sandbox script found; skipped." \
              | tee build-logs/sandbox-build.log
            status=0
          fi

          echo "$status" > build-logs/sandbox-build.exit
          exit "$status"

      - name: Generate Android project
        id: prebuild
        if: success()
        run: |
          set +e

          npx expo prebuild \
            --platform android \
            --clean \
            2>&1 | tee build-logs/expo-prebuild.log

          status=${PIPESTATUS[0]}
          echo "$status" > build-logs/expo-prebuild.exit
          exit "$status"

      - name: Inspect Android project
        if: always()
        run: |
          {
            echo "===== Android files ====="
            if [ -d android ]; then
              find android -maxdepth 4 -type f | sort | head -1000
            else
              echo "android directory not found"
            fi

            echo
            echo "===== Gradle wrapper ====="
            if [ -f android/gradlew ]; then
              ls -l android/gradlew
            else
              echo "gradlew not found"
            fi
          } > build-logs/android-project.log 2>&1

      - name: Build release APK
        id: gradle
        if: success()
        working-directory: android
        run: |
          set +e

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-build.log"

          status=${PIPESTATUS[0]}
          echo "$status" > "$GITHUB_WORKSPACE/build-logs/gradle-build.exit"
          exit "$status"

      - name: Collect Android reports
        if: always()
        run: |
          set +e

          mkdir -p build-logs/android-reports

          if [ -d android/build/reports ]; then
            cp -R android/build/reports/. \
              build-logs/android-reports/ 2>/dev/null || true
          fi

          if [ -d android/app/build/reports ]; then
            cp -R android/app/build/reports/. \
              build-logs/android-reports/ 2>/dev/null || true
          fi

          find android \
            -type f \
            \( -name "*.log" -o -name "hs_err_pid*.log" \) \
            -print \
            > build-logs/native-log-files.txt 2>&1 || true

      - name: Final diagnostics
        if: always()
        run: |
          {
            echo "===== BUILD RESULTS ====="
            echo "npm_install=${{ steps.npm_install.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "sandbox=${{ steps.sandbox.outcome }}"
            echo "prebuild=${{ steps.prebuild.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"

            echo
            echo "===== EXIT CODES ====="
            for file in build-logs/*.exit; do
              [ -f "$file" ] || continue
              echo "$(basename "$file"): $(cat "$file")"
            done

            echo
            echo "===== APK FILES ====="
            find android \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true
          } > build-logs/final-diagnostics.log 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineMovie-Vega-5.0.0-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CineMovie-Vega-5.0.0-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30
